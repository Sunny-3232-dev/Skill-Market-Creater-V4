<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキルマーケットを磨こう｜ハンズオン資料</title>
<style>
  :root {
    --bg: #fafaf9;
    --ink: #292524;
    --sub: #6b6560;
    --line: #e7e5e4;
    --accent: #e11d48;
    --accent-bg: #fff1f2;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f5f4f2;
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* 画面比に関係なく必ず収まる16:9のステージ。文字はこの幅(cqw)基準なのでどのモニターでも同じ見え方になる */
  #frame {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    overflow: hidden;
    background: var(--bg);
    background-image:
      radial-gradient(at 88% 4%, hsla(22,100%,72%,.13) 0, hsla(22,100%,72%,0) 46%),
      radial-gradient(at 4% 96%, hsla(339,100%,60%,.10) 0, hsla(339,100%,60%,0) 46%);
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 6cqw 6cqw 7.5cqw;
  }

  .label { font-size: 1.75cqw; font-weight: 700; letter-spacing: .12em; color: var(--accent); margin-bottom: 1.6cqw; }
  h1 { font-size: 7.2cqw; font-weight: 700; line-height: 1.22; letter-spacing: -.02em; }
  h2 { font-size: 5.2cqw; font-weight: 700; line-height: 1.32; letter-spacing: -.01em; }
  .lead { font-size: 2.45cqw; color: var(--sub); line-height: 1.75; margin-top: 1.8cqw; }

  ul { list-style: none; margin-top: 2.6cqw; }
  li {
    font-size: 2.7cqw; line-height: 1.55; padding: 1.1cqw 0 1.1cqw 1.3em;
    position: relative; border-bottom: 1px solid var(--line); font-weight: 500;
  }
  li:last-child { border-bottom: none; }
  li::before { content: "—"; position: absolute; left: 0; color: var(--line); }
  ol { list-style: none; counter-reset: step; margin-top: 2.6cqw; }
  ol li { padding-left: 2.1em; font-size: 2.6cqw; }
  ol li::before {
    counter-increment: step; content: counter(step);
    font-size: .68em; font-weight: 700; color: var(--accent); background: var(--accent-bg);
    width: 1.9em; height: 1.9em; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    top: 50%; transform: translateY(-50%);
  }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(24cqw, 1fr)); gap: 1.8cqw; margin-top: 2.8cqw; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 1.4cqw; padding: 2.4cqw; }
  .card .num { font-size: 1.55cqw; font-weight: 700; letter-spacing: .12em; color: var(--accent); margin-bottom: .7em; }
  .card h3 { font-size: 2.8cqw; font-weight: 700; line-height: 1.35; margin-bottom: .45em; }
  .card p { font-size: 1.9cqw; color: var(--sub); line-height: 1.65; }

  .slim { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6cqw 4cqw; margin-top: 2.6cqw; }
  .slim div {
    display: flex; align-items: baseline; gap: .7em;
    font-size: 2.5cqw; line-height: 1.45; padding: 1cqw 0;
    border-bottom: 1px solid var(--line); font-weight: 700;
  }
  .slim div span { font-size: .6em; font-weight: 700; color: var(--accent); letter-spacing: .06em; flex-shrink: 0; }
  .slim div em { font-style: normal; font-weight: 400; color: var(--sub); font-size: .7em; }

  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 1.2cqw; margin-top: 2.8cqw; font-size: 2.2cqw; font-weight: 700; }
  .flow span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .5em 1.1em; }
  .flow i { color: var(--line); font-style: normal; }

  .note-row { margin-top: 2.2cqw; font-size: 2cqw; color: var(--sub); line-height: 1.75; }
  .strong { color: var(--ink); font-weight: 700; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; align-items: start; margin-top: 2.1cqw; }
  .steps4 { list-style: none; }
  .steps4 li { border: none; padding: .8cqw 0; font-size: 2.35cqw; font-weight: 700; display: flex; gap: .6em; align-items: baseline; }
  .steps4 li::before { content: none; }
  .steps4 li b { color: var(--accent); font-size: .72em; letter-spacing: .04em; min-width: 5.2em; display: inline-block; }
  .steps4 li i { font-style: normal; font-weight: 400; color: var(--sub); font-size: .78em; }

  .tweet { background: #fff; border: 1px solid var(--line); border-radius: 1.6cqw; padding: 2.4cqw; font-size: 2.05cqw; line-height: 1.9; }
  .tweet .u { display: block; margin-bottom: .45em; }
  .tweet .url { display: block; color: var(--sub); font-size: .85em; margin-top: .3em; }

  .chat { display: flex; flex-direction: column; gap: 1.2cqw; }
  .chat span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .6em 1.2em; font-size: 2.05cqw; font-weight: 700; }
  .after { background: #fff; border: 1px solid var(--line); border-radius: 1.6cqw; padding: 2.4cqw; font-size: 2.05cqw; line-height: 1.85; }
  .after b { color: var(--accent); }

  svg { width: 100%; height: auto; display: block; }
  .figure { margin-top: 2.8cqw; }

  @keyframes rise { from { opacity: 0; transform: translateY(1.2cqw); } to { opacity: 1; transform: none; } }
  #stage > * { animation: rise .42s cubic-bezier(.2,.7,.3,1) both; }
  #stage > *:nth-child(2) { animation-delay: .07s; }
  #stage > *:nth-child(3) { animation-delay: .14s; }
  #stage > *:nth-child(4) { animation-delay: .21s; }
  @media (prefers-reduced-motion: reduce) { #stage > * { animation: none; } }

  .hl { background: linear-gradient(transparent 60%, rgba(225,29,72,.17) 60%); padding: 0 .06em; }

  .goal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2cqw; margin-top: 3.2cqw; }
  .goal > div { background: #fff; border: 1px solid var(--line); border-radius: 1.6cqw; padding: 2.6cqw; text-align: center; }
  .goal .n { font-size: 6.8cqw; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -.03em; }
  .goal .n small { font-size: .38em; margin-left: .12em; letter-spacing: 0; }
  .goal .t { margin-top: .6em; font-size: 2.2cqw; font-weight: 700; }
  .goal .s { margin-top: .35em; font-size: 1.75cqw; color: var(--sub); }

  .cover .label { color: var(--sub); }
  .cover .meta { margin-top: 3cqw; font-size: 2.05cqw; color: var(--sub); line-height: 1.85; }

  #bar { position: absolute; left: 0; bottom: 0; height: .35cqw; background: var(--accent); transition: width .25s ease; }
  #pager { position: absolute; right: 2.4cqw; bottom: 2.2cqw; font-size: 1.35cqw; color: var(--sub); letter-spacing: .1em; }
  #hint { position: absolute; left: 2.4cqw; bottom: 2.2cqw; font-size: 1.2cqw; color: #d6d3d1; }
  @media print { body { overflow: visible; } #bar, #pager, #hint { display: none; } }
</style>
</head>

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const pager = document.getElementById("pager");
let i = 0;

function render() {
  const s = slides[i];
  stage.className = s.cls || "";
  stage.innerHTML = s.html;
  bar.style.width = ((i + 1) / slides.length * 100) + "%";
  pager.textContent = (i + 1) + " / " + slides.length;
  location.hash = i + 1;
}
function go(n) {
  i = Math.max(0, Math.min(slides.length - 1, n));
  render();
}

document.addEventListener("keydown", e => {
  if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) { e.preventDefault(); go(i + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(i - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(slides.length - 1);
});
document.addEventListener("click", e => {
  go(e.clientX < window.innerWidth * 0.25 ? i - 1 : i + 1);
});
let tx = 0;
document.addEventListener("touchstart", e => tx = e.changedTouches[0].clientX, { passive: true });
document.addEventListener("touchend", e => {
  const d = e.changedTouches[0].clientX - tx;
  if (Math.abs(d) > 50) go(d < 0 ? i + 1 : i - 1);
}, { passive: true });

const start = parseInt(location.hash.replace("#", ""), 10);
go(isNaN(start) ? 0 : start - 1);
</script>
